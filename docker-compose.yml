services:
  claw:
    build: .
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      # Mount Google Calendar credentials if present
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/claw.db
      VECTOR_STORE_PATH: /app/data/vectors
      REPORT_OUTPUT_DIR: /app/reports
    restart: unless-stopped

