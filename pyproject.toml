[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claw"
version = "0.1.0"
description = "24/7 autonomous productivity tracking agent system built on NeMo Claw + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "nvidia-nat[langchain]>=1.6.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "gitpython>=3.1.40",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "schedule>=1.2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
